name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check yamllint
      - name: Validate YAML files
        run: yamllint .

  kustomize:
    name: Kubernetes Kustomize build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Build base manifests
        run: kubectl kustomize deploy/kubernetes/base
      - name: Build development overlay
        run: kubectl kustomize deploy/kubernetes/overlays/dev
      - name: Build staging overlay
        run: kubectl kustomize deploy/kubernetes/overlays/staging
