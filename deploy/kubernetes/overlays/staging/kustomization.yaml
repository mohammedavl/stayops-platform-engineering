apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stayops-staging
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
